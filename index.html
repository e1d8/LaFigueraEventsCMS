    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta property="og:site_name" content="La Figuera Events CMS">
    <meta property="og:title" content="La Figuera Events CMS">
    <meta property="og:description" content="Ferramenta per a editar la web: e1d8.github.io/LAFIGUERAEVENTS">
    <meta property="og:image" content="https://e1d8.github.io/LaFigueraEventsCMS/assets/figa-256.png?v=d1f3d434-8">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="256">
    <meta property="og:image:height" content="256">
    <meta property="og:image:alt" content="Logo de La Figuera Events CMS">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="La Figuera Events CMS">
    <meta name="twitter:description" content="Ferramenta per a editar la web: e1d8.github.io/LAFIGUERAEVENTS">
    <meta name="twitter:image" content="https://e1d8.github.io/LaFigueraEventsCMS/assets/figa-256.png?v=d1f3d434-8">
    <meta name="twitter:image:alt" content="Logo de La Figuera Events CMS">
    <link rel="icon" href="./assets/favicon.png?v=05d7c505-8">
    <link rel="stylesheet" href="./styles.css?v=20261106-8">
    <script type="module" src="./app.js?v=20261106-8"></script>
  </head>
  <body>
    <header class="header">
      <a class="brand" href="./" aria-label="La figuera · Editor">
        <img src="./assets/figa-256.png?v=d1f3d434-8" width="48" height="48" alt="">
        <span>La figuera<small>EVENTS CMS</small></span>
      </a>
      <div class="save-area"><span id="save-state" role="status" aria-live="polite"></span><button id="reset" type="button" title="Esborrar l’esborrany i carregar el contingut actual" disabled>Restablir</button><button id="save" class="primary" disabled>Guardar</button></div>
    </header>
    <div class="layout">
      <nav id="navigation" aria-label="Contingut"></nav>
      <main id="main" tabindex="-1"><p role="status">Carregant…</p></main>
    </div>
    <dialog id="password-dialog" aria-labelledby="password-title">
      <form id="password-form">
        <h2 id="password-title">Guardar els canvis</h2>
        <label for="password">Contrasenya</label>
        <input id="password" type="password" autocomplete="current-password" required maxlength="1024">
        <p id="password-error" class="error" role="alert"></p>
        <div class="actions"><button type="button" id="cancel-save">Cancel·lar</button><button type="submit" class="primary">Guardar</button></div>
      </form>
    </dialog>
    <dialog id="link-dialog" aria-labelledby="link-title">
      <form id="link-form">
        <h2 id="link-title">Enllaç</h2>
        <label for="link-url">Adreça</label><input id="link-url" type="text" placeholder="https://" required>
        <p id="link-error" class="error" role="alert"></p>
        <div class="actions"><button type="button" id="cancel-link">Cancel·lar</button><button type="submit" class="primary">Aplicar</button></div>
      </form>
    </dialog>
    <dialog id="result-dialog" aria-labelledby="result-title" aria-describedby="result-message">
      <h2 id="result-title">Resultat del guardat</h2>
      <div id="result-body" tabindex="0" aria-label="Mantín polsat per veure el pes enviat">
        <p id="result-message"></p>
        <p id="result-size" aria-live="polite" hidden></p>
      </div>
      <div class="actions"><button type="button" id="close-result" class="primary">Tancar</button></div>
    </dialog>
    <noscript><p>Activa JavaScript per editar el contingut.</p></noscript>
  </body>
</html>
